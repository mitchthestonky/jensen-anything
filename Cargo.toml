[package]
name = "jensen-anything"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Satire: pivot any company's story to AI infrastructure and prove the fundamentals did not change by a single byte."
license = "MIT"
readme = "README.md"
repository = "https://github.com/mitchthestonky/jensen-anything"
keywords = ["satire", "meme", "cli", "valuation", "parody"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
